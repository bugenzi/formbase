name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor library
        run: pnpm run build

      - name: Typecheck all packages
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Verify dist output
        run: |
          test -f packages/pdf-form-editor/dist/index.js || (echo "Missing ESM output" && exit 1)
          test -f packages/pdf-form-editor/dist/index.cjs || (echo "Missing CJS output" && exit 1)
          test -f packages/pdf-form-editor/dist/index.d.ts || (echo "Missing types" && exit 1)
          test -f packages/pdf-form-editor/dist/index.css || (echo "Missing CSS" && exit 1)
          echo "All dist outputs verified"
