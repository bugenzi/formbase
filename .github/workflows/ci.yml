name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      editor_changed: ${{ steps.changes.outputs.editor_changed }}
      web_changed: ${{ steps.changes.outputs.web_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base SHA found. Running full validation."
            echo "editor_changed=true" >> "$GITHUB_OUTPUT"
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt || true

          editor_changed=false
          web_changed=false

          while IFS= read -r file; do
            case "$file" in
              packages/pdf-form-editor/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.nvmrc|.npmrc|tsconfig.json|tsconfig.*|.github/workflows/ci.yml)
                editor_changed=true
                ;;
            esac

            case "$file" in
              apps/web/*|packages/pdf-form-editor/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|vercel.json|.nvmrc|.npmrc|tsconfig.json|tsconfig.*|.github/workflows/ci.yml)
                web_changed=true
                ;;
            esac
          done < changed_files.txt

          echo "editor_changed=$editor_changed" >> "$GITHUB_OUTPUT"
          echo "web_changed=$web_changed" >> "$GITHUB_OUTPUT"

  editor-validate:
    name: editor-validate
    needs: detect-changes
    if: needs.detect-changes.outputs.editor_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor package
        run: pnpm --filter @bugenzi/formpdf-editor build

      - name: Run editor tests
        run: pnpm --filter @bugenzi/formpdf-editor test

      - name: Typecheck editor package
        run: pnpm --filter @bugenzi/formpdf-editor typecheck

      - name: Verify editor dist output
        run: |
          test -f packages/pdf-form-editor/dist/index.js || (echo "Missing ESM output" && exit 1)
          test -f packages/pdf-form-editor/dist/index.cjs || (echo "Missing CJS output" && exit 1)
          test -f packages/pdf-form-editor/dist/index.d.ts || (echo "Missing types" && exit 1)
          test -f packages/pdf-form-editor/dist/index.css || (echo "Missing CSS" && exit 1)
          echo "All editor dist outputs verified"

  web-validate:
    name: web-validate
    needs: detect-changes
    if: needs.detect-changes.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor package
        run: pnpm --filter @bugenzi/formpdf-editor build

      - name: Typecheck web app
        run: pnpm --filter @formpdf/web typecheck

      - name: Build web app
        run: pnpm --filter @formpdf/web build
