# One-time bootstrap publish happens locally:
#   cd packages/pdf-form-editor
#   npm publish --access public
#
# After the package exists on npm, configure trusted publishing on npmjs.com:
#   GitHub user/org: bugenzi
#   Repository: formbase
#   Workflow filename: release-package.yml

name: Release Package

on:
  push:
    tags:
      - 'editor-v*'
  workflow_dispatch:

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-package:
    name: publish-package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor package
        run: pnpm --filter @bugenzi/formpdf-editor build

      - name: Run editor tests
        run: pnpm --filter @bugenzi/formpdf-editor test

      - name: Typecheck editor package
        run: pnpm --filter @bugenzi/formpdf-editor typecheck

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/pdf-form-editor/package.json').version")
          PACKAGE_NAME=$(node -p "require('./packages/pdf-form-editor/package.json').name")
          EXPECTED_TAG="editor-v${CURRENT_VERSION}"
          REF_NAME="${{ github.ref_name }}"

          SHOULD_PUBLISH=false
          REASON="not_requested"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_PUBLISH=true
            REASON="manual_dispatch"
          elif [ "$REF_NAME" = "$EXPECTED_TAG" ]; then
            SHOULD_PUBLISH=true
            REASON="matching_release_tag"
          else
            REASON="tag_does_not_match_package_version"
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "expected_tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "ref_name=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Print release decision
        run: |
          echo "Package: ${{ steps.release.outputs.package_name }}"
          echo "Current version: ${{ steps.release.outputs.current_version }}"
          echo "Expected tag: ${{ steps.release.outputs.expected_tag }}"
          echo "Triggered ref: ${{ steps.release.outputs.ref_name }}"
          echo "Should publish: ${{ steps.release.outputs.should_publish }}"
          echo "Reason: ${{ steps.release.outputs.reason }}"

      - name: Publish package
        if: steps.release.outputs.should_publish == 'true'
        working-directory: packages/pdf-form-editor
        run: npm publish --access public
